{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PopupLeads Hub{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Cache buster query string ?v=5 to bust cached stylesheet -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=5.0">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <!-- Flash Messages Banner -->
  {% if messages %}
    <div class="fixed top-4 right-4 z-50 flex flex-col gap-2">
      {% for message in messages %}
        <div class="p-3 px-4 rounded-lg shadow-lg text-sm font-semibold flex items-center gap-2 {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200{% elif message.tags == 'success' %}bg-emerald-50 text-emerald-700 border border-emerald-200{% else %}bg-blue-50 text-blue-700 border border-blue-200{% endif %}">
          <span>{{ message }}</span>
        </div>
      {% endfor %}
    </div>
  {% endif %}

  {% block content %}{% endblock %}

  {% block extra_scripts %}{% endblock %}
</body>
</html>
